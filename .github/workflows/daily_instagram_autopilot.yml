name: Daily Instagram Carousel Autopilot

on:
  schedule:
    # Runs daily at 13:00 UTC (2:00 PM WAT Africa/Lagos)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (publish or preflight)'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - preflight
      day:
        description: 'Optional specific day number (1-30) to publish'
        required: false
        type: string

permissions:
  contents: write

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & Chromium for slide rendering
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Daily Carousel Autopilot
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_MCP_URL: https://connect.composio.dev/mcp
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "preflight" ]; then
            python src/daily_autopilot.py --preflight
          elif [ -n "${{ github.event.inputs.day }}" ]; then
            python src/daily_autopilot.py --day "${{ github.event.inputs.day }}"
          else
            python src/daily_autopilot.py
          fi

      - name: Commit updated published_state.json back to repo
        if: ${{ github.event.inputs.mode != 'preflight' }}
        run: |
          git config user.name "Quietly Wealthy Autopilot"
          git config user.email "autopilot@quietlywealthy.local"
          git add content_queue/published_state.json
          git diff --staged --quiet || git commit -m "chore(autopilot): record published carousel state [skip ci]"
          git push

