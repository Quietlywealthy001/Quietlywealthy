<!doctype html>
<!--
  Reusable Instagram carousel slide — 1080x1350 (4:5 portrait).
  Placeholders (filled by src/carousel.py):
    {{FONT_LINK}} {{HANDLE}} {{BRAND}} {{MONOGRAM}} {{NUM}} {{TOTAL}} {{PROGRESS}}
    {{VARIANT}}  -> "cover" | "body" | "cta"
    {{CONTENT}}  -> inner HTML of the slide
  Palette locked to brand rules (.agent/rules/instagram-brand-and-safety.md).
-->
<html><head><meta charset="utf-8">{{FONT_LINK}}
<style>
:root{--obsidian:#0B0D10;--card:#14181F;--white:#F7F5F0;--gold:#E5B84B;--emerald:#10B981;
--serif:'Playfair Display',Georgia,serif;--sans:'Inter','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:var(--obsidian);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--white);font-family:var(--sans);
  background:radial-gradient(90% 60% at 100% 0%,#14181F 0%,#0B0D10 60%)}
.slide.cta{background:radial-gradient(80% 60% at 50% 40%,#14181F 0%,#0B0D10 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(247,245,240,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(247,245,240,.035) 1px,transparent 1px);background-size:90px 90px;
  -webkit-mask-image:radial-gradient(70% 60% at 80% 10%,#000 0%,transparent 70%)}
.hdr{position:absolute;top:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;
  font-size:24px;font-weight:600;letter-spacing:.06em;color:rgba(247,245,240,.7)}
.hdr .who{display:flex;align-items:center;gap:16px}
.hdr .who svg{width:54px;height:54px}
.hdr .count{font-variant-numeric:tabular-nums;letter-spacing:.2em}
.hdr .count b{color:var(--gold)}
.main{position:absolute;left:80px;right:80px;top:190px;bottom:170px;display:flex;flex-direction:column;justify-content:center}
.ftr{position:absolute;left:80px;right:80px;bottom:70px;display:flex;align-items:center;gap:28px}
.bar{flex:1;height:4px;background:rgba(247,245,240,.12);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:{{PROGRESS}}%;background:var(--gold)}
.swipe{font-size:22px;font-weight:700;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.cta .swipe{color:var(--emerald)}

/* typography + components */
.kicker{font-size:26px;font-weight:700;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;
  display:flex;align-items:center;gap:18px;margin-bottom:34px}
.kicker:before{content:"";width:56px;height:3px;background:var(--gold)}
h1{font-family:var(--serif);font-size:100px;line-height:1.02;font-weight:700;letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:76px;line-height:1.06;font-weight:700;letter-spacing:-.005em}
em{font-style:italic;color:var(--gold);font-weight:600}
.g{color:var(--emerald)}
p.lead{font-size:36px;line-height:1.45;color:rgba(247,245,240,.78);margin-top:36px}
.step{font-family:var(--serif);font-size:30px;color:var(--gold);letter-spacing:.06em;margin-bottom:22px}
.card{background:var(--card);border:1px solid rgba(229,184,75,.18);border-radius:22px;padding:38px 44px;margin-top:40px}
.card .lbl{font-size:20px;font-weight:700;letter-spacing:.28em;color:rgba(247,245,240,.5);text-transform:uppercase;margin-bottom:14px}
.card .big{font-size:34px;line-height:1.4;color:var(--white)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px}
.vs .card{margin-top:0;padding:32px 34px}
.vs .bad{border-color:rgba(247,245,240,.12)} .vs .bad .big{color:rgba(247,245,240,.55);text-decoration:line-through;text-decoration-color:rgba(247,245,240,.35)}
.vs .good{border-color:rgba(16,185,129,.55)}
.math{margin-top:40px;border-top:1px solid rgba(247,245,240,.12)}
.math div{display:flex;justify-content:space-between;align-items:baseline;padding:24px 0;border-bottom:1px solid rgba(247,245,240,.12);font-size:34px}
.math div span:last-child{font-family:var(--serif);font-weight:700;color:var(--white);font-size:42px}
.math div.total span:last-child{color:var(--emerald);font-size:56px}
.note{font-size:21px;color:rgba(247,245,240,.42);margin-top:22px;letter-spacing:.04em}
.flow{display:flex;flex-direction:column;gap:16px;margin-top:40px}
.flow div{display:flex;align-items:center;gap:26px;background:var(--card);border-radius:18px;padding:24px 30px;font-size:31px;border:1px solid rgba(247,245,240,.06)}
.flow b{flex:none;width:58px;height:58px;border-radius:50%;background:rgba(229,184,75,.14);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:28px}
.flow div.win{border-color:rgba(16,185,129,.6)} .flow div.win b{background:var(--emerald);color:var(--obsidian)}
.pill{display:inline-block;background:var(--emerald);color:var(--obsidian);font-weight:800;padding:8px 22px;border-radius:999px;letter-spacing:.06em}
.ratio{display:flex;height:96px;border-radius:18px;overflow:hidden;margin-top:40px;font-weight:800;font-size:30px}
.ratio div{display:flex;align-items:center;justify-content:center}
.cover-mark{position:absolute;right:-170px;bottom:-170px;opacity:.07}
.ctaBox{border:2px solid var(--gold);border-radius:28px;padding:50px;text-align:center;background:rgba(20,24,31,.85);margin-top:48px}
.ctaBox .kw{font-family:var(--serif);font-size:120px;color:var(--gold);font-weight:700;line-height:1;margin:18px 0}
.ctaBox p{font-size:32px;line-height:1.45;color:rgba(247,245,240,.82)}
.center{text-align:center}
</style></head>
<body>
<div class="slide {{VARIANT}}">
  <div class="grid"></div>
  <div class="hdr"><div class="who">{{MONOGRAM}}<span>{{HANDLE}}</span></div>
    <div class="count"><b>{{NUM}}</b> / {{TOTAL}}</div></div>
  <div class="main">{{CONTENT}}</div>
  <div class="ftr"><div class="bar"><i></i></div><div class="swipe">{{SWIPE}}</div></div>
</div>
</body></html>
